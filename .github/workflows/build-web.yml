name: Build URU Web App

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Type check
        run: |
          if grep -q "type-check" package.json; then
            bun run type-check
          else
            echo "type-check script not found, skipping"
          fi
        continue-on-error: true

      - name: Build application
        run: bun run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: uru-web-build
          path: dist/
          retention-days: 30

      - name: Create Release
        if: startsWith(github.ref, 'refs/heads/main')
        uses: ncipollo/release-action@v1
        with:
          artifacts: |
            dist/**/*
          tag: ${{ github.sha }}
          name: "URU Web Build - ${{ github.sha }}"
          body: |
            ## 🚀 URU Personal AI Middleware Build

            **Commit:** ${{ github.sha }}
            **Branch:** ${{ github.ref_name }}
            **Date:** ${{ github.event.head_commit.timestamp }}

            ### 📦 Artifacts
            - URU Web Build (dist/ directory)

            ### 🚀 Deployment
            Deploy to Vercel, Netlify, or any static host

            ### 🔧 Local Testing
            ```bash
            bun install
            bun run dev
            # Visit http://localhost:5173
            ```

            ---
            Generated by GitHub Actions
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Summary
        if: always()
        run: |
          echo "✅ Build Completed!"
          echo ""
          echo "📊 Build Output:"
          ls -lh dist/ 2>/dev/null || echo "⚠️ No dist/ folder found"
          echo ""
          echo "📦 Download artifacts:"
          echo "1. Go to: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo "2. Scroll to 'Artifacts' section"
          echo "3. Download uru-web-build"
