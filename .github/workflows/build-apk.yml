name: Build URU APK

on:
  push:
    branches:
      - claude/clean-architecture-mvvm-refactor-c77r5x
      - main
      - master
  pull_request:
    branches:
      - claude/clean-architecture-mvvm-refactor-c77r5x
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          ndk-version: '26.0.10792818'

      - name: Grant execute permission to gradlew
        run: chmod +x android-clean-architecture/gradlew

      - name: Build Debug APK
        run: cd android-clean-architecture && ./gradlew clean assembleDebug

      - name: Build Release APK (unsigned)
        run: cd android-clean-architecture && ./gradlew assembleRelease

      - name: Upload Debug APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: URU-debug-apk
          path: android-clean-architecture/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Upload Release APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: URU-release-apk
          path: android-clean-architecture/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 30

      - name: Create Release
        if: startsWith(github.ref, 'refs/heads/claude/clean-architecture')
        uses: ncipollo/release-action@v1
        with:
          artifacts: |
            android-clean-architecture/build/outputs/apk/debug/app-debug.apk,
            android-clean-architecture/build/outputs/apk/release/app-release-unsigned.apk
          tag: ${{ github.sha }}
          name: "URU Build - ${{ github.sha }}"
          body: |
            ## 🚀 URU APK Build

            **Commit:** ${{ github.sha }}
            **Branch:** ${{ github.ref_name }}
            **Date:** ${{ github.event.head_commit.timestamp }}

            ### 📦 Artifacts
            - `URU-debug-apk` - Debug version for testing
            - `URU-release-apk` - Release version (unsigned)

            ### 📱 Installation
            ```bash
            adb install -r app-debug.apk
            adb shell am start -n com.uru/.presentation.ui.MainActivity
            ```

            ---
            Generated by GitHub Actions
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Summary
        if: always()
        run: |
          echo "✅ Build Completed!"
          echo ""
          echo "📱 Download APK:"
          echo "1. Go to: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo "2. Scroll to 'Artifacts' section"
          echo "3. Download URU-debug-apk or URU-release-apk"
          echo ""
          echo "📊 APK Sizes:"
          ls -lh android-clean-architecture/build/outputs/apk/*/
